<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/icon/favicon-icon.png" />

    <!-- Viewport for Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Divine Energy - Empowering a Brighter Tomorrow</title>
    <meta
      name="title"
      content="Divine Energy - Empowering a Brighter Tomorrow"
    />
    <meta
      name="description"
      content="Devine Energy provides solar rooftop solutions for residential, commercial, and industrial projects in India. Apply now to get ₹78,000 subsidy under PM Surya Ghar Yojana."
    />
    <meta
      name="keywords"
      content="Devine Energy, solar panels India, PM Surya Ghar Yojana, solar subsidy, solar rooftop, solar installation, renewable energy India, solar energy, government subsidy solar"
    />
    <meta name="author" content="Devine Energy Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.divineenergy.in/" />
    <meta
      property="og:title"
      content="Divine Energy - Empowering a Brighter Tomorrow"
    />
    <meta
      property="og:description"
      content="Empowering homes and businesses in India with solar energy. Get government subsidy & 25 years solar plate warranty."
    />
    <meta
      property="og:image"
      content="https://www.divineenergy.in/images/banner/solar-cover.jpg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.divineenergy.in/" />
    <meta
      name="twitter:title"
      content="Divine Energy - Empowering a Brighter Tomorrow"
    />
    <meta
      name="twitter:description"
      content="Empowering homes and businesses in India with solar energy. Get government subsidy & 25 years solar plate warranty."
    />
    <meta
      name="twitter:image"
      content="https://www.divineenergy.in/images/banner/solar-cover.jpg"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.divineenergy.in/" />

    <!-- Robots -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Preconnect for performance (optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font Optimization (optional, if you use Google Fonts) -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=YourFontFamily&display=swap" rel="stylesheet"> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
